# Hanzo Base — the ONE file that says how this repo builds, gates and ships.
#
# The only workflow is `.hanzo/workflows/cicd.yml`, ~10 lines that import
# hanzoai/ci. Everything real is here, and platform.hanzo.ai reads this same
# file, so there is one description of this build rather than one per front door.
#
# It replaces `.hanzo/workflows/deploy.yml`, which was a hand-rolled copy of
# three things the reusable already does — buildx, the ghcr login, and the
# post-push "does the manifest actually resolve" check. What that file did NOT
# do is gate anything: this repo is 64 Go packages with tests and CI ran none of
# them, so `go vet` had been failing on `main` and nobody could see it.

# Tests run DIRECTLY on the runner, not inside the image build, and hanzoai/ci
# provisions the toolchain from go.mod (1.26.5) plus a C compiler.
#
# CGO_ENABLED=0 ON EVERY GATE, because that is how Base ships — the Dockerfile
# builds `CGO_ENABLED=0` and the pure-Go modernc SQLite that comes with it. With
# cgo ON the runner links a system SQLite instead, and Base refuses to start:
#
#   base: the SQLite engine linked into this binary has no math functions
#   (no such function: acos) — search filters using geoDistance would fail at
#   query time. Rebuild with CGO_ENABLED=0 (how Base ships)
#
# That is `tests.NewTestApp()` returning an error, so every suite that needs an
# app panics on the nil — 24 of 64 packages, all with one cause. Measured: with
# cgo, 24 FAIL; with CGO_ENABLED=0, 64 ok. The gate has to build the binary the
# repo actually publishes, or it is testing a program we do not ship.
#
# GOEXPERIMENT=jsonv2 ON EVERY GATE, for exactly the same reason and learned the
# expensive way. The Dockerfile has set it since 05fbe4ff, so `encoding/json` in
# the published binary is the v2 implementation while the gate tested v1 — two
# different decoders, one of them never exercised. They disagree: v1 resolves an
# Unmarshaler only on a type that has methods, v2 resolves it on the element, so
# `type alias *Collection` decoded under v1 and recursed forever under v2. Base
# 0.39.16 crash-looped ~95 minutes on a stack overflow that TestCollectionUnmarshalJSON
# already covered and the gate could not see. The gate has to run the decoder the
# repo actually publishes, or it is testing a program we do not ship.
#
# GOWORK=off for the same class of reason: a go.work in a parent directory would
# silently change which modules resolve, and CI must read this repo's go.mod.
test:
  - name: go-build
    # First and cheapest. A compile error fails here in seconds with one clear
    # message instead of surfacing as a wall of package-level noise under vet.
    run: |
      set -e
      export GOWORK=off CGO_ENABLED=0 GOEXPERIMENT=jsonv2
      go build ./...
  - name: go-vet
    # This was RED on main and had been for as long as there was no gate. The
    # cause was one line in tools/router/unmarshal_request_data_test.go: a
    # deliberately unexported field carrying a `json` tag the code under test
    # never reads (UnmarshalRequestData defaults structTagKey to "form"). The
    # `form` tag it does read is untouched, so the assertion is unchanged and vet
    # is honest again.
    run: |
      set -e
      export GOWORK=off CGO_ENABLED=0 GOEXPERIMENT=jsonv2
      go vet ./...
  - name: go-test
    # The whole tree, not a named list — an allowlist stops covering whatever is
    # added after it is written. 64 packages carry tests; 23 have none and say so.
    # ./tests/engine is among the 64, which is what makes the Postgres gate below
    # a comparison: the same assertions have already answered on SQLite here.
    run: |
      set -e
      export GOWORK=off CGO_ENABLED=0 GOEXPERIMENT=jsonv2
      go test -count=1 ./...
  - name: network-attack-suite
    # A second reading of a package `go-test` already ran, asking the one
    # question a green suite cannot answer about itself: were its SKIPS honest?
    #
    # network/attack_vectors_test.go is adversarial, and a test there is either
    # an ASSERTION of a defence or a MARKER for one this package does not hold.
    # A marker skips, so `go test` reports the same word — SKIP — for "we chose
    # not to defend this" and for "the defence went away and I quietly stopped
    # checking". Nothing in `go test` separates those, exit status least of all:
    # a package whose every test skipped is `ok`.
    #
    # The file used to assert this was enforced by a workflow. It named
    # `.github/workflows/network-attack-suite.yml`, which has never existed in
    # this repo — so the sentence "CI treats any other skip reason as a hard
    # failure" was, for as long as anyone had read it, describing this gate's
    # absence. It is the shape it warned about: an uncovered case with a comment
    # saying it is watched.
    #
    # TWO THINGS ARE ENFORCED, and both fail the build.
    #
    # First, the REASON. A marker's whole body is t.Skip(blockedReason), so
    # exactly one string may appear, and it is read out of the Go source rather
    # than repeated here — one spelling, and a gate that follows the file it
    # polices. Any other reason is a test that met a condition it did not expect
    # and excused itself, which is the failure it exists to report.
    #
    # Second, the SET, and this is what a count could not do. The declared set
    # is every test whose source states the canonical skip; the observed set is
    # every test that skipped. They must be equal, in both directions:
    #   - skipped without declaring  → a conditional skip fired. An assertion
    #     stopped asserting and reported it as a choice.
    #   - declared without skipping  → the marker's body did not run to the
    #     skip, so the test is not the shape it claims.
    # The second half is what forbids the conditional shape structurally: a test
    # that skips only WHEN it finds the defence missing passes on the day it is
    # written and is caught here, before it can ever be the thing that hides a
    # regression. Six tests in this file were that shape; one of them passed by
    # failing to reach AWS.
    #
    # Why not pin the count. A number cannot tell one defence landing apart from
    # another regressing — those net to zero and the gate stays green through
    # both. It also has to be edited by hand on every legitimate change, so it
    # rots into a number nobody trusts. The set costs nothing to maintain
    # because it is DERIVED from the same file the tests live in: land a defence
    # by deleting its marker, and the two sets agree again with nothing else to
    # update. The count is printed, because the map of what is undefended is
    # worth reading; it is the set that is held.
    #
    # The names are printed on every run, pass or fail. That list IS the map of
    # what this package does not defend, and a map only anyone can see by
    # digging is how the last one went stale.
    run: |
      set -euo pipefail
      export GOWORK=off CGO_ENABLED=0 GOEXPERIMENT=jsonv2
      log="${RUNNER_TEMP:-/tmp}/network-attack.json"
      code=0
      go test -count=1 -json ./network/ > "$log" || code=$?
      if [ "$code" != 0 ]; then
        # What the failing tests said, and only them. Everything printed after
        # the first failure belongs to tests that were fine.
        jq -sr '
          map(select(.Test != null)) as $e
          | ($e | map(select(.Action == "fail") | .Test) | unique)
          | map(. as $t | $e | map(select(.Test == $t and .Action == "output") | .Output) | join(""))
          | .[]' "$log" > "$log.failed" 2>/dev/null || true
        # Empty when the package did not build, and then the whole stream is
        # the message.
        if [ -s "$log.failed" ]; then cat "$log.failed"; else cat "$log"; fi
        echo "::error::the network attack suite failed — a defence it asserts has regressed"
        exit 1
      fi
      # The one spelling of the skip reason, read from the constant itself.
      reason=$(sed -n 's/^const blockedReason = "\(.*\)"$/\1/p' network/attack_vectors_test.go)
      [ -n "$reason" ] || { echo "::error::network/attack_vectors_test.go declares no blockedReason for the suite to skip on"; exit 1; }
      # Each skipped test and the message it skipped with: the last line it
      # printed carrying a file:line, which is what t.Skip emits.
      jq -sr '
        map(select(.Test != null)) as $e
        | ($e | map(select(.Action == "skip") | .Test) | unique)
        | map(. as $t | "\($t)\t" + (
            $e | map(select(.Test == $t and .Action == "output") | .Output)
               | map(select(test("\\.go:[0-9]+: ")))
               | last // ""
               | sub("^\\s+\\S+\\.go:[0-9]+: "; "")
               | rtrimstr("\n")))
        | .[]' "$log" > "$log.skips"
      bad=0
      while IFS=$'\t' read -r name said; do
        [ -n "$name" ] || continue
        if [ "$said" != "$reason" ]; then
          echo "::error::$name skipped saying \"$said\" — the suite skips for one reason, \"$reason\", and anything else is a test excusing itself"
          bad=1
        fi
      done < "$log.skips"
      cut -f1 "$log.skips" | sort > "$log.observed"
      # Declared: the tests whose source states the canonical skip. The match is
      # a whole statement on its own line, so prose about the shape — this
      # gate's own comment, the suite's header — is not mistaken for the shape.
      # And the enclosing function resets per file, or the last test of one file
      # answers for the first line of the next.
      awk 'FNR == 1 { fn = "" }
           /^func Test/ { fn = $2; sub(/\(.*/, "", fn) }
           /^[[:space:]]*t\.Skip\(blockedReason\)[[:space:]]*$/ && fn != "" { print fn }' \
        network/*_test.go | sort -u > "$log.declared"
      while read -r name; do
        echo "::error::$name skipped but declares no marker — an assertion stopped asserting and reported it as a skip"
        bad=1
      done < <(comm -23 "$log.observed" "$log.declared")
      while read -r name; do
        echo "::error::$name declares a marker but did not skip — a marker's whole body is the skip, so a test that reaches past it is a different shape than it claims"
        bad=1
      done < <(comm -13 "$log.observed" "$log.declared")
      [ "$bad" = 0 ] || exit 1
      # The map of what this package does not defend, on every run.
      echo "not defended by ./network, each one declared:"
      sed 's/^/  /' "$log.observed"
      p=$(jq -r 'select(.Action=="pass" and .Test != null)' "$log" | jq -s length)
      s=$(wc -l < "$log.observed" | tr -d ' ')
      echo "network: $p passed, $s skipped, 0 failed"
  - name: go-test-postgres
    # Base serves the whole /v1 data plane on PostgreSQL as well as SQLite, and
    # until this gate nothing ran a line of it. Every gate above is SQLite by
    # construction, and no test in the tree opened a server connection — so the
    # engine that the dialect, the filter spellings, the write pool and the
    # backup refusal were all written for was the one nothing ever executed.
    #
    # WHAT THIS COVERS: ./tests/engine, a corpus that builds its fixtures through
    # Base's own API and asserts the same answers whichever engine holds them —
    # filters (case-insensitive match, truth values, numbers, numbers reached
    # through a JSON path), paging and sorting, collection DDL down to the
    # columns and the declared index, a field added to a live collection and
    # queried in the next breath, eight writers arriving together, settings
    # encrypted through the round trip, and a backup that refuses where it cannot
    # hold the database. The same corpus runs on SQLite in `go-test` above, so a
    # divergence surfaces as one engine disagreeing with the other rather than as
    # a Postgres-only assertion with nothing to compare against.
    #
    # WHAT THIS DOES NOT COVER: every other package. `core` and `apis` cannot be
    # pointed at a server, because tests/data is a SQLite FILE — demo1..demo5,
    # the users and the view collections their assertions name live inside it,
    # and running migrations produces none of them. Pointed at Postgres today,
    # `core` panics after four tests. `tools/search` asserts the SQL TEXT SQLite
    # is handed, so it tests a spelling rather than an answer and would have to
    # be rewritten to mean anything on a second engine. Porting that fixture is
    # what widens this gate; the mechanism it would need is already here, in
    # tests.NewTestAppWithConfig.
    #
    # postgres:18 and not ghcr.io/hanzoai/sql:18, because Base uses none of what
    # that image adds — vector, postgis, pg_cron, pgcrypto — and its init script
    # hard-fails the container over the database name pg_cron pins. What Base
    # does need from a server is ICU, for the nondeterministic `nocase` collation
    # the dialect's Prelude creates so that COLLATE NOCASE means the same thing
    # on both engines, and gen_random_uuid(), which has been core since 13. The
    # official image carries both; measured, not assumed.
    #
    # The server joins the JOB's network namespace instead of publishing a port.
    # The runner's docker daemon is the host's and is shared with every other job
    # on that node, so a published 5432 would collide with whatever else is
    # building and would not be at localhost from in here anyway. One mechanism,
    # spelled for the two ways a job can be hosted.
    #
    # A server this cannot reach is a FAILURE and never a skip: tests/postgres.go
    # panics rather than falling back to a file, because a gate that quietly
    # tests SQLite twice is worse than no gate at all.
    #
    # Readiness is proved by making the tests' OWN connection — that address,
    # those credentials, that database — rather than by asking the container
    # whether it is up. The two answer differently when something else is already
    # on the port, and then the gate would run against a server it did not make.
    run: |
      set -euo pipefail
      export GOWORK=off CGO_ENABLED=0 GOEXPERIMENT=jsonv2
      export BASE_TEST_POSTGRES='postgres://base:base@127.0.0.1:5432/base?sslmode=disable'
      pg=base-postgres-$$
      trap 'docker rm -f "$pg" >/dev/null 2>&1 || true' EXIT
      if [ -f /.dockerenv ]; then net="container:$(cat /etc/hostname)"; else net=host; fi
      docker run -d --name "$pg" --network "$net" \
        -e POSTGRES_USER=base -e POSTGRES_PASSWORD=base -e POSTGRES_DB=base \
        postgres:18 >/dev/null
      for i in $(seq 60); do
        docker exec "$pg" psql "$BASE_TEST_POSTGRES" -tAc 'select 1' >/dev/null 2>&1 && break
        [ "$i" = 60 ] && { echo "::error::nothing answers as this gate's server at $BASE_TEST_POSTGRES"; docker logs "$pg"; exit 1; }
        sleep 1
      done
      go test -count=1 ./tests/engine/
  - name: releases
    # A release that builds nothing looks exactly like a release that built.
    # v1.5.17 reached CI and its build died; v1.5.18 and v1.5.24 never reached CI
    # at all. All three cut a Go module while ghcr stayed on v1.5.16 for six days,
    # and NOTHING said so — the only thing that reports here is a run, and the
    # failure was the absence of one. A pipeline cannot notice its own silence, so
    # this asks the registry rather than the pipeline.
    #
    # The two lists compared here are compared nowhere else: github carries the
    # tags, because that is where a push cuts the Go module, and ghcr is where the
    # image has to end up. Either one alone looks healthy in exactly this failure.
    #
    # No credential, so it cannot fail for want of one: `ls-remote` speaks the git
    # protocol rather than the REST API (no token, no rate-limit budget), and
    # ghcr's token endpoint issues an anonymous pull token for a public package.
    #
    # The floor is the OLDEST v* tag ghcr already carries, never a number written
    # here. Tags below it predate verbatim tag publishing and correctly have no
    # image; a literal would be right today and wrong at the release that moves
    # the range. The tag being built right now is excluded — its image is pushed
    # by a later step, so demanding it here would fail every release on principle.
    #
    # The second half is the opposite failure, and the reason it is here rather
    # than anywhere else: THIS gate runs BEFORE the push, so it can prevent the
    # collision instead of reporting it afterwards.
    #
    # Two counters write into one namespace. A `v*` tag publishes verbatim AND as
    # a bare alias (v1.5.16 + 1.5.16), while every push to main and every pull
    # request derives the next patch above whatever ghcr already carries and
    # publishes it bare. So branch builds spend release numbers: git stopped at
    # v1.5.27 while the bare series ran on to 1.5.46, and a v1.5.28 tag cut today
    # would republish 1.5.28 onto a different digest — silently changing what
    # anything pinned to that number resolves to.
    #
    # A branch build can never land ON a release, because it derives above every
    # number the registry carries in either spelling. The corruption only runs
    # the other way, so that is the direction closed here: a release has to be
    # strictly above the high-water, and the error says which number is free.
    #
    # The cost of settling it this way, rather than by moving branch builds out
    # of the semver namespace: release numbers are no longer contiguous or freely
    # chosen. Every push and every PR consumes one, gaps are permanent, and a
    # patch can never be cut below the current series — this repo ships from main
    # only, so nothing needs that. What it buys is that no published tag changes
    # shape, which keeps 40-odd repos on hanzoai/ci untouched; the alternative
    # fix lives there and alters what every image in five orgs is named.
    run: |
      set -euo pipefail
      img=$(yq -r '.images[0].repo' hanzo.yml)
      pkg=${img#ghcr.io/}
      tok=$(curl -fsSL "https://ghcr.io/token?scope=repository:${pkg}:pull&service=ghcr.io" | jq -r .token)
      tags=$(curl -fsSL -H "Authorization: Bearer $tok" "https://ghcr.io/v2/${pkg}/tags/list?n=1000" | jq -r '.tags[]')
      have=$(printf '%s\n' "$tags" | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V)
      [ -n "$have" ] || { echo "::error::${img} carries no v* tag — the release lane has never published"; exit 1; }
      floor=$(printf '%s\n' "$have" | head -1)
      # Both spellings, because a release writes both and a branch build writes
      # the bare one — reading either alone understates what is taken.
      water=$(printf '%s\n' "$tags" | sed 's/^v//' | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)
      if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
        cut=${GITHUB_REF_NAME#v}
        if [ "$cut" = "$water" ] || [ "$(printf '%s\n%s\n' "$cut" "$water" | sort -V | tail -1)" != "$cut" ]; then
          echo "::error::${GITHUB_REF_NAME} is not above ${water}, the highest ${img} already carries — its ${cut} alias lands inside the range branch builds have taken, changing what that number resolves to. Cut v${water%.*}.$(( ${water##*.} + 1 )) or above."
          exit 1
        fi
        echo "${GITHUB_REF_NAME} is above the published high-water ${water}"
      fi
      missing=
      for t in $(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" \
                 | sed -n 's#.*refs/tags/\(v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$#\1#p' | sort -V -u); do
        [ "$(printf '%s\n%s\n' "$floor" "$t" | sort -V | head -1)" = "$floor" ] || continue
        if [ "${GITHUB_REF_TYPE:-}" = tag ] && [ "$t" = "${GITHUB_REF_NAME:-}" ]; then continue; fi
        printf '%s\n' "$have" | grep -qx -- "$t" || missing="$missing $t"
      done
      [ -z "$missing" ] || { echo "::error::these release tags published no image to ${img}:$missing"; exit 1; }
      echo "release tags from $floor up all resolve to an image in ${img}"

images:
  - name: base
    context: .
    dockerfile: Dockerfile
    repo: ghcr.io/hanzoai/base
    # amd64 only, exactly what deploy.yml built. The cluster has no arm64 nodes,
    # and adding an arch here means QEMU-emulating a full Go build for consumers
    # that do not exist yet. Add linux/arm64 when something pulls it.
    platforms: [linux/amd64]
    # NOTE on the version this publishes: a `v*` tag IS the version and is
    # published verbatim (v1.5.16 + the 1.5.16 alias). A branch build derives the
    # next patch above what ghcr already carries, via hanzoai/ci's bin/imgver —
    # so main stops publishing only `sha-<short>`, which is what left this image
    # with no deployable tag between releases. `sha-<short>-amd64` is still
    # published beside it for forensics.
    #
    # The build takes no git credential. Every module in this graph is public,
    # so `go mod download` is the public proxy verified against go.sum. The
    # reusable still offers buildx a `gh_token` secret; this Dockerfile does not
    # mount it, and BuildKit ignores a secret nothing asks for.

# No `deploy:` ON PURPOSE, and this is a transcription of what deploy.yml
# already said, not a new policy.
#
# `ghcr.io/hanzoai/base` is a base image other products embed, and it is also
# what base.hanzo.ai runs. Every consumer pins its own tag AND digest in a
# reviewed hanzoai/universe change:
#
#   base.hanzo.ai           charts/app/values/hanzo/base.yaml
#   hanzo/platform          base:1.3.0    (BASE_ENABLE_ADMIN_UI=1)
#   hanzo/hanzo-app-base    base:0.39.16
#   hanzo/cal               base:cal-a2b6ce3
#   superbase               base:1.3.2 via SUPERBASE_BASE_IMAGE_TAG
#
# base.hanzo.ai was served by ghcr.io/hanzoai/superbase when this file was
# written, and the note here said curling that host proved nothing about this
# build. It was repointed at ghcr.io/hanzoai/base, so the opposite holds now, and
# it is the only check that shows a build actually reached production: the served
# HTML names the ui-react bundle by content hash, so it equals the committed
# ui-react/dist exactly when the tag universe pins is the one built here. Moving
# the pin from sha-f83f922 to sha-6a9de08 flipped the served bundle inside a
# minute.
#
# Consumers sitting on different tags is precisely why choosing which one runs
# is a reviewed change and not a CI side effect. cd.hanzo.ai's selfHeal would
# revert a direct patch inside minutes anyway. CI's job ends at "the tag exists
# and resolves".
